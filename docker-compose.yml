services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hackeval_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackeval}
      POSTGRES_USER: ${POSTGRES_USER:-hackeval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackeval_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hackeval} -d ${POSTGRES_DB:-hackeval}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: hackeval_redis
    command: redis-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 300M

  ollama:
    image: ollama/ollama:latest
    container_name: hackeval_ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    # ── NVIDIA GPU support ──────────────────────────────────────────────────
    # 1. Install nvidia-container-toolkit on the host
    # 2. Uncomment the deploy block below
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    # ────────────────────────────────────────────────────────────────────────
    healthcheck:
      test: ["CMD-SHELL", "ollama list > /dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 600s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        echo "Waiting for Ollama to start..."
        sleep 15
        echo "Pulling nomic-embed-text..."
        ollama pull nomic-embed-text
        echo "Pulling qwen2.5:7b..."
        ollama pull qwen2.5:7b
        echo "Pulling qwen2.5-coder:7b..."
        ollama pull qwen2.5-coder:7b
        echo "All models ready."
        wait
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackeval_backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hackeval}:${POSTGRES_PASSWORD:-hackeval_secret}@postgres:5432/${POSTGRES_DB:-hackeval}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./backend:/app
      - workspace:/workspace
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hackeval_worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-hackeval}:${POSTGRES_PASSWORD:-hackeval_secret}@postgres:5432/${POSTGRES_DB:-hackeval}
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./backend:/app
      - workspace:/workspace
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    command: python -m arq app.jobs.worker.WorkerSettings
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hackeval_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:alpine
    container_name: hackeval_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  ollama_models:
    driver: local
  workspace:
    driver: local
